[package]
name = "bindforge-access"
version.workspace = true
edition.workspace = true
rust-version = "1.87"
license.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
platform-linux = { path = "../platform-linux" }
remap-core = { path = "../remap-core" }
udev = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rustix = { version = "1.1", features = ["fs", "process"] }

[[bin]]
name = "bindforge-device-access"
path = "src/main.rs"

[lints]
workspace = true
